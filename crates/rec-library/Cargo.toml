[package]
name = "rec-library"
description = "Reads saved rec clips for AI tools: sidecars, session journals, overlaps, timelines, Media Foundation frame decoding and after-save analysis."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rec-core.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
# Builds the clips the trim tests cut.
rec-mux = { path = "../rec-mux" }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
]
